<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Overall Architecture DP Impact</title>
  <desc id="desc">DP1 중복 제어, DP2 권한/버전 제어, DP3 Knowledge Access가 전체 아키텍처에 미치는 영역</desc>
  <style>
    .bg{fill:#f8fbff}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.dp1{fill:#dbeafe;stroke:#2563eb;stroke-width:4;opacity:.82}.dp2{fill:#dcfce7;stroke:#16a34a;stroke-width:4;opacity:.82}.dp3{fill:#fef3c7;stroke:#d97706;stroke-width:4;opacity:.86}
    .t{font:700 25px Arial,sans-serif;fill:#172033}.h{font:700 18px Arial,sans-serif;fill:#243247}.s{font:600 15px Arial,sans-serif;fill:#334155}.l{font:700 17px Arial,sans-serif;fill:#0f172a}.small{font:13px Arial,sans-serif;fill:#64748b}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="t" x="48" y="55">Overall Architecture에서 DP 영향 영역</text>

  <rect class="box" x="48" y="92" width="260" height="260" rx="16"/><text class="h" x="84" y="128">Internal Sources</text>
  <rect class="box" x="78" y="155" width="200" height="42" rx="9"/><text class="s" x="112" y="182">Code Repositories</text>
  <rect class="box" x="78" y="211" width="200" height="42" rx="9"/><text class="s" x="111" y="238">API / Design Docs</text>
  <rect class="box" x="78" y="267" width="200" height="42" rx="9"/><text class="s" x="103" y="294">IAM / Version Data</text>

  <rect class="box" x="370" y="92" width="330" height="410" rx="16"/><text class="h" x="432" y="128">Offline Processing</text>
  <rect class="dp1" x="398" y="155" width="250" height="92" rx="12"/><text class="l" x="435" y="190">DP1 중복 제어</text><text class="small" x="425" y="218">Segment / EU / Source Mapping</text>
  <rect class="dp2" x="398" y="270" width="250" height="92" rx="12"/><text class="l" x="424" y="305">DP2 권한/버전 태깅</text><text class="small" x="421" y="333">Permission + Source Version</text>
  <rect class="dp3" x="398" y="385" width="250" height="82" rx="12"/><text class="l" x="429" y="420">DP3 지식 계층 생성</text><text class="small" x="437" y="448">Knowledge Cache / Wiki</text>

  <rect class="box" x="770" y="92" width="260" height="410" rx="16"/><text class="h" x="842" y="128">Storage</text>
  <rect class="dp1" x="800" y="155" width="200" height="58" rx="10"/><text class="s" x="834" y="190">RAG Index</text>
  <rect class="dp2" x="800" y="235" width="200" height="58" rx="10"/><text class="s" x="824" y="270">Permission / Version</text>
  <rect class="dp3" x="800" y="315" width="200" height="58" rx="10"/><text class="s" x="839" y="350">Knowledge Cache</text>
  <rect class="box" x="800" y="395" width="200" height="58" rx="10"/><text class="s" x="846" y="430">Audit Logs</text>

  <rect class="box" x="1090" y="92" width="260" height="410" rx="16"/><text class="h" x="1176" y="128">Online QA</text>
  <rect class="box" x="1120" y="155" width="200" height="42" rx="9"/><text class="s" x="1162" y="182">Query API</text>
  <rect class="dp2" x="1120" y="215" width="200" height="62" rx="10"/><text class="s" x="1149" y="242">Auth / Version</text><text class="small" x="1168" y="263">Resolver</text>
  <rect class="dp3" x="1120" y="300" width="200" height="62" rx="10"/><text class="s" x="1146" y="327">Router / Cache</text><text class="small" x="1160" y="348">Fallback Policy</text>
  <rect class="box" x="1120" y="385" width="200" height="42" rx="9"/><text class="s" x="1160" y="412">Internal LLM</text>
  <rect class="box" x="1120" y="445" width="200" height="42" rx="9"/><text class="s" x="1150" y="472">Citation / Audit</text>

  <path class="line" d="M308 220 H370"/><path class="line" d="M700 295 H770"/><path class="line" d="M1030 295 H1090"/>
  <path class="line" d="M1000 184 C1060 184 1060 176 1120 176"/>
  <path class="line" d="M1000 264 C1060 264 1060 246 1120 246"/>
  <path class="line" d="M1000 344 C1060 344 1060 331 1120 331"/>

  <rect x="64" y="570" width="24" height="16" class="dp1"/><text class="small" x="100" y="584">DP1: 중복 데이터 제어와 Source Mapping</text>
  <rect x="64" y="610" width="24" height="16" class="dp2"/><text class="small" x="100" y="624">DP2: 권한/버전 Metadata, Source Scope Routing/Filtering, Audit</text>
  <rect x="64" y="650" width="24" height="16" class="dp3"/><text class="small" x="100" y="664">DP3: 반복/정책/설계 지식 접근, Cache, Fallback</text>
</svg>
