<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">QA KPI Dashboard</title>
  <desc id="desc">정확도, 응답 속도, 보안성, 권한/버전 정합성, 중복 강건성, 근거 추적성을 보여주는 KPI 대시보드</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.t{font:700 21px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.s{font:600 13px Arial,'Noto Sans KR',sans-serif;fill:#334155}.v{font:700 25px Arial,'Noto Sans KR',sans-serif}.muted{font:500 11px Arial,'Noto Sans KR',sans-serif;fill:#64748b}.barbg{fill:#e2e8f0}.b1{fill:#2563eb}.b2{fill:#16a34a}.b3{fill:#dc2626}.b4{fill:#0891b2}.b5{fill:#d97706}.b6{fill:#7c3aed}</style></defs>
  <rect class="bg" width="1200" height="360" rx="22"/>
  <text class="t" x="52" y="48">요구사항/QA KPI 후보</text>
  <g transform="translate(40,85)"><rect class="card" width="175" height="210" rx="16"/><text class="s" x="24" y="42">정확도</text><text class="v b1" x="24" y="82">EM / F1</text><rect class="barbg" x="24" y="112" width="128" height="14" rx="7"/><rect class="b1" x="24" y="112" width="108" height="14" rx="7"/><text class="muted" x="24" y="158">Baseline 이상</text></g>
  <g transform="translate(225,85)"><rect class="card" width="175" height="210" rx="16"/><text class="s" x="24" y="42">응답 속도</text><text class="v b2" x="24" y="82">P95</text><rect class="barbg" x="24" y="112" width="128" height="14" rx="7"/><rect class="b2" x="24" y="112" width="96" height="14" rx="7"/><text class="muted" x="24" y="158">5s / 2s 목표</text></g>
  <g transform="translate(410,85)"><rect class="card" width="175" height="210" rx="16"/><text class="s" x="24" y="42">보안성</text><text class="v b3" x="24" y="82">0%</text><rect class="barbg" x="24" y="112" width="128" height="14" rx="7"/><rect class="b3" x="24" y="112" width="128" height="14" rx="7"/><text class="muted" x="24" y="158">Unauthorized Exposure</text></g>
  <g transform="translate(595,85)"><rect class="card" width="175" height="210" rx="16"/><text class="s" x="24" y="42">권한/버전</text><text class="v b4" x="24" y="82">0%</text><rect class="barbg" x="24" y="112" width="128" height="14" rx="7"/><rect class="b4" x="24" y="112" width="128" height="14" rx="7"/><text class="muted" x="24" y="158">Wrong Version Citation</text></g>
  <g transform="translate(780,85)"><rect class="card" width="175" height="210" rx="16"/><text class="s" x="24" y="42">중복 강건성</text><text class="v b5" x="24" y="82">Dup ↓</text><rect class="barbg" x="24" y="112" width="128" height="14" rx="7"/><rect class="b5" x="24" y="112" width="110" height="14" rx="7"/><text class="muted" x="24" y="158">Top-K Duplicate Ratio</text></g>
  <g transform="translate(965,85)"><rect class="card" width="175" height="210" rx="16"/><text class="s" x="24" y="42">근거 추적성</text><text class="v b6" x="24" y="82">Trace</text><rect class="barbg" x="24" y="112" width="128" height="14" rx="7"/><rect class="b6" x="24" y="112" width="116" height="14" rx="7"/><text class="muted" x="24" y="158">File / Commit / Citation</text></g>
</svg>
