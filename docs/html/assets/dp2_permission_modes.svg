<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">DP2 권한/버전 전략 비교</title>
  <desc id="desc">권한/버전 기반 Source Routing과 Source Metadata Post-filtering 비교</desc>
  <style>
    .bg{fill:#f8fbff}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.a{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.b{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.warn{fill:#fff7ed;stroke:#d97706;stroke-width:2}
    .t{font:700 22px Arial,sans-serif;fill:#172033}.h{font:700 18px Arial,sans-serif;fill:#243247}.s{font:600 14px Arial,sans-serif;fill:#334155}.small{font:13px Arial,sans-serif;fill:#64748b}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="470"/>
  <text class="t" x="40" y="44">DP2 후보는 A/B 두 개: 권한 + 버전 + 출처 Metadata</text>

  <rect class="panel" x="45" y="75" width="525" height="300" rx="16"/>
  <text class="h" x="78" y="112">A. Source Routing / 분리 Index</text>
  <rect class="a" x="80" y="145" width="140" height="50" rx="10"/><text class="s" x="113" y="176">Query</text>
  <rect class="a" x="260" y="135" width="190" height="70" rx="10"/><text class="s" x="298" y="163">Auth / Version</text><text class="small" x="316" y="185">Resolver</text>
  <rect class="a" x="135" y="245" width="135" height="48" rx="10"/><text class="small" x="164" y="275">Project Scope</text>
  <rect class="a" x="310" y="245" width="135" height="48" rx="10"/><text class="small" x="336" y="275">Release Scope</text>
  <path class="line" d="M220 170 H260"/><path class="line" d="M355 205 C300 230 240 230 203 245"/><path class="line" d="M375 205 C395 225 390 230 378 245"/>
  <text class="small" x="78" y="333">검색 전에 접근 가능한 Source Scope를 선택한다.</text>
  <text class="small" x="78" y="355">장점: 보안/버전 경계 명확, 감사 설명 용이</text>

  <rect class="panel" x="630" y="75" width="525" height="300" rx="16"/>
  <text class="h" x="663" y="112">B. Unified DB + Source Metadata Post-filtering</text>
  <rect class="b" x="665" y="145" width="130" height="50" rx="10"/><text class="s" x="700" y="176">Query</text>
  <rect class="b" x="835" y="135" width="150" height="70" rx="10"/><text class="s" x="870" y="163">Unified</text><text class="small" x="878" y="185">Top-K Prime</text>
  <rect class="b" x="1018" y="135" width="100" height="70" rx="10"/><text class="small" x="1032" y="163">Source</text><text class="small" x="1026" y="184">Metadata</text>
  <rect class="warn" x="835" y="245" width="210" height="48" rx="10"/><text class="small" x="861" y="275">Permission + Version Filter</text>
  <path class="line" d="M795 170 H835"/><path class="line" d="M985 170 H1018"/><path class="line" d="M910 205 V245"/>
  <text class="small" x="663" y="333">검색 후 출처 Metadata로 권한/버전을 검증한다.</text>
  <text class="small" x="663" y="355">장점: 운영 단순, Citation Metadata 재사용 용이</text>

  <text class="small" x="52" y="430">Decision: A를 기본 전략으로 선택하고, B는 통합 운영성이 중요한 구간의 보조 전략으로 둔다.</text>
</svg>
