<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="360" viewBox="0 0 1320 360" role="img" aria-labelledby="title desc">
  <title id="title">FR Pipeline Overview</title>
  <desc id="desc">Functional Requirements가 걸리는 간략 파이프라인. Offline, Online, LLM, Response/Audit 단계로 구분한다.</desc>
  <style>
    .bg{fill:#f8fbff}.band{fill:#fff;stroke:#cbd5e1;stroke-width:2}.offline{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.online{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.llm{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3}.audit{fill:#fef3c7;stroke:#d97706;stroke-width:3}
    .t{font:700 24px Arial,sans-serif;fill:#172033}.h{font:700 17px Arial,sans-serif;fill:#1f2937}.s{font:600 13px Arial,sans-serif;fill:#334155}.small{font:12px Arial,sans-serif;fill:#64748b}.fr{font:700 11px Arial,sans-serif;fill:#0f172a}
    .line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1320" height="360"/>
  <text class="t" x="42" y="46">FR 관점 간략 파이프라인</text>

  <rect class="band" x="40" y="75" width="520" height="225" rx="18"/>
  <text class="h" x="245" y="106">Offline</text>
  <rect class="offline" x="70" y="135" width="135" height="64" rx="12"/>
  <text class="s" x="94" y="162">1 Source</text><text class="small" x="92" y="184">수집</text>
  <rect class="offline" x="235" y="135" width="135" height="64" rx="12"/>
  <text class="s" x="255" y="162">2 Parse</text><text class="small" x="255" y="184">Metadata</text>
  <rect class="offline" x="400" y="135" width="135" height="64" rx="12"/>
  <text class="s" x="422" y="162">3 Dedup</text><text class="small" x="427" y="184">Index</text>
  <path class="line" d="M205 167 H235"/><path class="line" d="M370 167 H400"/>
  <text class="fr" x="82" y="238">FR-01</text><text class="fr" x="135" y="238">FR-05</text><text class="fr" x="188" y="238">FR-08</text>
  <text class="fr" x="247" y="238">FR-03</text><text class="fr" x="300" y="238">FR-04</text><text class="fr" x="353" y="238">FR-07</text>
  <text class="fr" x="412" y="238">FR-01</text><text class="fr" x="465" y="238">FR-04</text><text class="fr" x="518" y="238">FR-08</text>

  <rect class="band" x="610" y="75" width="360" height="225" rx="18"/>
  <text class="h" x="765" y="106">Online</text>
  <rect class="online" x="640" y="135" width="135" height="64" rx="12"/>
  <text class="s" x="658" y="162">4 Query</text><text class="small" x="653" y="184">Auth / Version</text>
  <rect class="online" x="805" y="135" width="135" height="64" rx="12"/>
  <text class="s" x="829" y="162">5 Retrieval</text><text class="small" x="835" y="184">RAG Cache</text>
  <path class="line" d="M775 167 H805"/>
  <text class="fr" x="646" y="238">FR-02</text><text class="fr" x="699" y="238">FR-03</text><text class="fr" x="752" y="238">FR-08</text>
  <text class="fr" x="817" y="238">FR-02</text><text class="fr" x="870" y="238">FR-07</text><text class="fr" x="923" y="238">FR-08</text>

  <rect class="band" x="1020" y="75" width="130" height="225" rx="18"/>
  <text class="h" x="1065" y="106">LLM</text>
  <rect class="llm" x="1045" y="135" width="80" height="64" rx="12"/>
  <text class="s" x="1060" y="162">6 Answer</text><text class="small" x="1060" y="184">Context</text>
  <text class="fr" x="1048" y="238">FR-02</text><text class="fr" x="1048" y="260">FR-05</text><text class="fr" x="1048" y="282">FR-08</text>

  <rect class="band" x="1190" y="75" width="90" height="225" rx="18"/>
  <text class="h" x="1204" y="106">Output</text>
  <rect class="audit" x="1205" y="135" width="60" height="64" rx="12"/>
  <text class="s" x="1214" y="162">7</text><text class="small" x="1215" y="184">Audit</text>
  <text class="fr" x="1202" y="238">FR-05</text><text class="fr" x="1202" y="260">FR-06</text><text class="fr" x="1202" y="282">FR-08</text>

  <path class="line" d="M560 167 H610"/><path class="line" d="M970 167 H1020"/><path class="line" d="M1150 167 H1190"/>
  <text class="small" x="44" y="332">색상: Offline은 데이터 준비/인덱싱, Online은 질의 처리/검색, LLM은 답변 생성, Output은 Citation과 Audit을 의미한다.</text>
</svg>
