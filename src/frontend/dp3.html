<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DP3 Cache PoC</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --ink: #172033;
      --muted: #657084;
      --line: #d8dee9;
      --accent: #176b87;
      --accent-2: #2e7d64;
      --soft: #e9f2f5;
      --warn: #9a5b13;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
    }
    header {
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0; }
    nav a { margin-left: 18px; color: var(--muted); text-decoration: none; }
    main {
      display: grid;
      grid-template-columns: minmax(360px, 430px) minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      min-height: calc(100vh - 56px);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .settings {
      padding: 16px;
      overflow: auto;
      max-height: calc(100vh - 92px);
    }
    .section {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .section:first-child { border-top: 0; padding-top: 0; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    label {
      display: block;
      margin: 11px 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    input, select, button { font: inherit; }
    input[type="number"], select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .checkline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.secondary {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: #fff;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      background: var(--soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .content {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      min-width: 0;
    }
    .status {
      min-height: 62px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .status strong { font-size: 16px; }
    .status span { color: var(--muted); }
    .progress-wrap {
      margin-top: 8px;
      width: min(520px, 56vw);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: #e5eaf1;
    }
    .progress-bar > div {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .results {
      padding: 16px;
      overflow: auto;
      max-height: calc(100vh - 166px);
    }
    .empty {
      padding: 56px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
      margin: 12px 0 16px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      min-width: 0;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      border-top: 1px solid #edf0f4;
    }
    .metric:first-of-type { border-top: 0; }
    .metric span { color: var(--muted); }
    .metric b { font-variant-numeric: tabular-nums; text-align: right; }
    .result-block { margin-bottom: 18px; }
    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
      background: #fff;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 680px;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #edf0f4;
      text-align: left;
      vertical-align: top;
      font-variant-numeric: tabular-nums;
    }
    th {
      color: var(--muted);
      background: #fafbfc;
      font-size: 12px;
      position: sticky;
      top: 0;
    }
    .mode-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }
    .log {
      white-space: pre-wrap;
      background: #101828;
      color: #e5e7eb;
      padding: 12px;
      border-radius: 8px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      overflow: auto;
      max-height: 360px;
    }
    @media (max-width: 1080px) {
      main { grid-template-columns: 1fr; }
      .settings, .results { max-height: none; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>DP3 Cache PoC</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/compare">Compare</a>
      <a href="/chat">Chat</a>
    </nav>
  </header>

  <main>
    <aside class="panel settings">
      <div class="section">
        <h2>테스트 종류</h2>
        <label for="testCase">Test Case</label>
        <select id="testCase">
          <option value="cache">TC1. Cache 동작 확인</option>
          <option value="mixed_timing">TC2. 권한/버전 혼합 수행시간</option>
          <option value="scalability">TC3. 데이터셋 확장성</option>
        </select>
        <div id="caseHint" class="hint"></div>
      </div>

      <div class="section">
        <h2>공용 옵션</h2>
        <label for="datasetFamily">Dataset Family</label>
        <select id="datasetFamily">
          <option value="longbench">LongBench</option>
          <option value="ragbench">RAGBench</option>
        </select>

        <label for="dataset">Dataset / Subset</label>
        <select id="dataset"></select>

        <label for="datasetSplit">Dataset Split</label>
        <select id="datasetSplit">
          <option value="test">test</option>
          <option value="validation">validation</option>
          <option value="train">train</option>
        </select>

        <div class="row">
          <div>
            <label for="numExamples">기준 EU 예제 수</label>
            <input id="numExamples" type="number" min="1" max="500" value="5">
          </div>
          <div>
            <label for="queryCount">테스트 질문 수</label>
            <input id="queryCount" type="number" min="1" max="1000" value="100">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="warmupCount">Warm-up 질문 수</label>
            <input id="warmupCount" type="number" min="0" max="20" value="3">
          </div>
          <div>
            <label for="seed">샘플 Seed</label>
            <input id="seed" type="number" value="7">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="scope">기본 Scope</label>
            <select id="scope">
              <option value="A">A</option>
              <option value="B">B</option>
            </select>
          </div>
          <div>
            <label for="maxScale">확장성 최대 배율</label>
            <input id="maxScale" type="number" min="1" max="5" value="5">
          </div>
        </div>

        <label class="checkline"><input id="resetMetadata" type="checkbox"> versioned EU metadata 재생성</label>
      </div>

      <div class="section">
        <h2>LLM 옵션</h2>
        <label for="llmOption">LLM</label>
        <select id="llmOption">
          <option value="mock">Mock</option>
          <option value="llama-3.1-8b-instant">Llama 8B - llama-3.1-8b-instant</option>
          <option value="llama-3.3-70b-versatile">Llama 70B - llama-3.3-70b-versatile</option>
          <option value="qwen/qwen3.6-27b">Qwen 27B - qwen/qwen3.6-27b</option>
        </select>
        <div class="hint">TC1은 Cache 검증용이라 항상 Mock으로 실행합니다. TC2/TC3은 선택한 LLM을 사용합니다.</div>
      </div>

      <div class="section">
        <h2>A안 옵션</h2>
        <label for="sampleRate">필터링 질문풀 비율 <span id="sampleRateText" class="pill">10%</span></label>
        <input id="sampleRate" type="range" min="1" max="30" value="10">

        <div class="row">
          <div>
            <label for="minPerDataset">Dataset별 최소</label>
            <input id="minPerDataset" type="number" min="1" max="50" value="5">
          </div>
          <div>
            <label for="poolSeed">질문풀 Seed</label>
            <input id="poolSeed" type="number" value="42">
          </div>
        </div>

        <label for="routeThreshold">Route Threshold <span id="routeText" class="pill">0.70</span></label>
        <input id="routeThreshold" type="range" min="0" max="100" value="70">
      </div>

      <div class="section">
        <h2>A/B 공통 옵션</h2>
        <label for="cacheThreshold">Cache Hit Threshold <span id="cacheText" class="pill">0.86</span></label>
        <input id="cacheThreshold" type="range" min="0" max="100" value="86">

        <label class="checkline"><input id="useReranker" type="checkbox"> Cross-Encoder reranking 사용</label>
        <div class="row">
          <div>
            <label for="rerankCandidates">Rerank 후보 수</label>
            <input id="rerankCandidates" type="number" min="5" max="100" value="30">
          </div>
          <div>
            <label for="rerankModel">Reranker</label>
            <select id="rerankModel">
              <option value="cross-encoder/ms-marco-MiniLM-L-6-v2">ms-marco-MiniLM-L-6-v2</option>
            </select>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="prepareBtn">Prepare</button>
        <button id="seedBtn">Seed Pool</button>
      </div>
      <div class="actions">
        <button id="runSuiteBtn" class="primary">선택 테스트 시작</button>
        <button id="refreshBtn">Refresh Stats</button>
      </div>
    </aside>

    <section class="content">
      <div class="panel status">
        <div>
          <strong id="statusTitle">준비됨</strong><br>
          <span id="statusText">테스트 종류와 옵션을 지정한 뒤 시작하세요.</span>
          <div id="progressWrap" class="progress-wrap" hidden>
            <div class="progress-meta">
              <span id="progressStep">-</span>
              <span id="progressCount">0 / 0</span>
            </div>
            <div class="progress-bar"><div id="progressFill"></div></div>
          </div>
        </div>
        <span id="poolInfo" class="pill">pool: -</span>
      </div>

      <div class="panel results">
        <div id="resultRoot" class="empty">아직 실행 결과가 없습니다.</div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const API_BASE = location.port === "8000" ? "" : "http://127.0.0.1:8000";
    const controls = [
      "testCase", "datasetFamily", "dataset", "datasetSplit", "numExamples", "queryCount", "warmupCount", "seed", "scope", "maxScale",
      "resetMetadata", "llmOption", "sampleRate", "minPerDataset", "poolSeed", "routeThreshold",
      "cacheThreshold", "useReranker", "rerankCandidates", "rerankModel", "prepareBtn", "seedBtn",
      "runSuiteBtn", "refreshBtn"
    ];

    const caseHints = {
      cache: "A/B 각각 V1 질문을 한 번 실행한 뒤 같은 V1 질문을 반복 실행합니다. Cache가 실제로 재사용되는지 확인합니다.",
      mixed_timing: "권한과 버전을 섞은 질문 N개를 A/B에 동일하게 던지고, route/cache/RAG/LLM 시간을 비교합니다.",
      scalability: "데이터셋을 1배부터 최대 5배까지 키우며 No-cache, A안, B안의 RAG 비용 증가를 비교합니다."
    };

    function setBusy(isBusy, title, text) {
      controls.forEach((id) => { $(id).disabled = isBusy; });
      if (title) $("statusTitle").textContent = title;
      if (text) $("statusText").textContent = text;
    }

    function threshold(id) {
      return Number($(id).value) / 100;
    }

    function updateLabels() {
      $("sampleRateText").textContent = `${$("sampleRate").value}%`;
      $("routeText").textContent = threshold("routeThreshold").toFixed(2);
      $("cacheText").textContent = threshold("cacheThreshold").toFixed(2);
      $("caseHint").textContent = caseHints[$("testCase").value] || "";
      if ($("testCase").value === "mixed_timing" && $("queryCount").dataset.userEdited !== "true") {
        $("queryCount").value = 200;
      }
    }

    async function api(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`${response.status} ${text}`);
      }
      return response.json();
    }

    function sourceId() {
      if ($("datasetFamily").value === "ragbench") {
        return `dp3_ragbench_${$("dataset").value}_${$("datasetSplit").value}_${Number($("numExamples").value)}`;
      }
      return `dp3_longbench_${$("dataset").value}_${Number($("numExamples").value)}`;
    }

    function llmPayload() {
      const option = $("llmOption").value;
      if (option === "mock") {
        return { llm_provider: "mock", model: null };
      }
      return { llm_provider: "groq", model: option };
    }

    function suitePayload() {
      return {
        test_case: $("testCase").value,
        dataset_family: $("datasetFamily").value,
        dataset_name: $("dataset").value,
        dataset_split: $("datasetSplit").value,
        num_examples: Number($("numExamples").value),
        query_count: Number($("queryCount").value),
        seed: Number($("seed").value),
        warmup_count: Number($("warmupCount").value),
        user_scope: $("scope").value,
        max_scale: Number($("maxScale").value),
        route_threshold: threshold("routeThreshold"),
        cache_threshold: threshold("cacheThreshold"),
        ...llmPayload(),
        use_reranker: $("useReranker").checked,
        rerank_candidates: Number($("rerankCandidates").value),
        rerank_model: $("rerankModel").value,
        reset_metadata: $("resetMetadata").checked,
        include_smoke: false
      };
    }

    async function loadDatasets() {
      if ($("datasetFamily").value === "ragbench") {
        const data = await api("/api/dp3/ragbench/datasets");
        const localRows = Object.fromEntries(
          (data.datasets || []).map((d) => [`${d.dataset}:${d.split}`, d.rows])
        );
        $("dataset").innerHTML = (data.available_subsets || ["techqa", "emanual"]).map((name) => {
          const rows = localRows[`${name}:${$("datasetSplit").value}`];
          return `<option value="${name}">${name}${rows ? ` (${rows})` : ""}</option>`;
        }).join("");
        const tc = $("testCase").value;
        if (["mixed_timing", "similar_pair_quality"].includes(tc)) {
          $("dataset").value = "emanual";
        } else {
          $("dataset").value = "techqa";
        }
        return;
      }

      const data = await api("/api/dp3/longbench/datasets");
      $("dataset").innerHTML = data.datasets.map((d) =>
        `<option value="${d.dataset}">${d.dataset} (${d.rows})</option>`
      ).join("");
      if (data.datasets.some((d) => d.dataset === "multifieldqa_en")) {
        $("dataset").value = "multifieldqa_en";
      }
    }

    async function refreshStats() {
      const stats = await api("/api/dp3/question-pool/stats");
      $("poolInfo").textContent = `pool: ${stats.total}`;
      return stats;
    }

    async function prepareLongBench() {
      const family = $("datasetFamily").value;
      setBusy(true, `${family === "ragbench" ? "RAGBench" : "LongBench"} 준비 중`, "ROI-RAG EU와 versioned metadata를 준비합니다.");
      try {
        const path = family === "ragbench" ? "/api/dp3/ragbench/prepare" : "/api/dp3/longbench/prepare";
        const result = await api(path, {
          method: "POST",
          body: JSON.stringify({
            dataset_name: $("dataset").value,
            dataset_split: $("datasetSplit").value,
            num_examples: Number($("numExamples").value),
            auto_download: true,
            reset: false,
            reset_metadata: $("resetMetadata").checked
          })
        });
        $("statusTitle").textContent = `${family === "ragbench" ? "RAGBench" : "LongBench"} 준비 완료`;
        $("statusText").textContent = `${result.source_id}, EU ${result.context_unit_count}, version rows ${result.version_rows}`;
        renderLog(result);
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    async function seedPool() {
      const family = $("datasetFamily").value;
      setBusy(true, "질문풀 생성 중", `${family === "ragbench" ? "RAGBench" : "LongBench"} 질문에서 A안 routing pool을 seed합니다.`);
      try {
        const result = await api("/api/dp3/question-pool/seed", {
          method: "POST",
          body: JSON.stringify({
            dataset_family: family,
            dataset: family === "ragbench" ? $("dataset").value : null,
            dataset_split: $("datasetSplit").value,
            sample_rate: threshold("sampleRate"),
            min_per_dataset: Number($("minPerDataset").value),
            seed: Number($("poolSeed").value),
            reset: true,
            include_smoke: false
          })
        });
        await refreshStats();
        $("statusTitle").textContent = "질문풀 생성 완료";
        $("statusText").textContent = `${result.total_questions || result.seeded_questions || 0}개 중 ${result.seeded_questions}개 seed`;
        renderLog(result);
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    async function runSuite() {
      const payload = suitePayload();
      const label = $("testCase").selectedOptions[0].textContent;
      setBusy(true, `${label} 실행 중`, "Warm-up 후 측정 구간을 실행합니다.");
      try {
        const started = await api("/api/dp3/test-suite/start", {
          method: "POST",
          body: JSON.stringify(payload)
        });
        updateProgress(started);
        renderRunning(started);

        let job = started;
        while (!["completed", "failed"].includes(job.status)) {
          await sleep(1000);
          job = await api(`/api/dp3/test-suite/jobs/${started.job_id}`);
          updateProgress(job);
          renderRunning(job);
        }
        if (job.status === "failed") {
          throw new Error(job.error || "테스트 실행 중 오류가 발생했습니다.");
        }
        const result = job.result;
        $("statusTitle").textContent = `${label} 완료`;
        $("statusText").textContent = result.test_case === "scalability"
          ? `${result.max_scale}개 scale, 질문 ${result.query_count}개`
          : `${result.query_count}개 질문, dataset=${payload.dataset_name}`;
        updateProgress({ ...job, progress_percent: 100, completed: job.total });
        renderSuiteResult(result);
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function updateProgress(job) {
      $("progressWrap").hidden = false;
      const total = job.total || 1;
      const done = job.completed || 0;
      const pct = Number.isFinite(Number(job.progress_percent))
        ? Number(job.progress_percent)
        : Math.round((done / total) * 1000) / 10;
      $("progressStep").textContent = job.current_step || job.status || "-";
      $("progressCount").textContent = `${done} / ${total} · ${fmt(pct)}%`;
      $("progressFill").style.width = `${Math.min(100, Math.max(0, pct))}%`;
      $("statusText").textContent = `${job.current_step || "실행 중"} · ${done}/${total}`;
    }

    function renderRunning(job) {
      $("resultRoot").className = "";
      $("resultRoot").innerHTML = `
        <div class="card">
          <h3>테스트 실행 중</h3>
          ${metric("Job", job.job_id || "-")}
          ${metric("상태", job.status || "-")}
          ${metric("현재 단계", job.current_step || "-")}
          ${metric("진행률", `${fmt(job.progress_percent || 0)}%`)}
          ${metric("완료", `${job.completed || 0} / ${job.total || 1}`)}
        </div>
      `;
    }

    function pct(ratio) {
      return `${((ratio || 0) * 100).toFixed(1)}%`;
    }

    function fmt(value, digits = 1) {
      if (!Number.isFinite(Number(value))) return "-";
      return Number(value).toFixed(digits);
    }

    function stat(summary, key, part = "avg") {
      return summary?.timing_stats_ms?.[key]?.[part];
    }

    function statText(summary, key) {
      const s = summary?.timing_stats_ms?.[key];
      if (!s) return "-";
      return `${fmt(s.avg)} / ${fmt(s.min)} / ${fmt(s.max)} ms`;
    }

    function metric(label, value, extra = "") {
      return `<div class="metric"><span>${label}</span><b>${value}${extra ? ` <small>${extra}</small>` : ""}</b></div>`;
    }

    function passLabel(pass) {
      return {
        v1_first: "V1 첫 실행",
        v1_repeat: "V1 반복",
        mixed: "혼합 실행",
        scale: "Scale 실행"
      }[pass] || pass;
    }

    function summaryCards(result) {
      const blocks = [];
      if (result.a) {
        blocks.push(...result.a.passes.map((p) => modeCard("A안", p)));
      }
      if (result.b) {
        blocks.push(...result.b.passes.map((p) => modeCard("B안", p)));
      }
      return `<div class="cards">${blocks.join("")}</div>`;
    }

    function modeCard(title, pass) {
      const s = pass.summary;
      if (pass.mode === "A") {
        return `
          <div class="card">
            <h3>${title} · ${passLabel(pass.pass)}</h3>
            ${metric("Total", s.total)}
            ${metric("Route 통과", s.route_passed, pct(s.route_pass_ratio))}
            ${metric("Cache hit", s.cache_hits, pct(s.cache_hit_ratio))}
            ${metric("Validator 통과", s.validation_passed, pct(s.validation_pass_ratio))}
            ${metric("RAG fallback", s.fallbacks, pct(s.fallback_ratio))}
            ${metric("LLM calls", s.llm_calls)}
          </div>
        `;
      }
      return `
        <div class="card">
          <h3>${title} · ${passLabel(pass.pass)}</h3>
          ${metric("Total", s.total)}
          ${metric("Cache hit", s.context_cache_hits, pct(s.cache_hit_ratio))}
          ${metric("Validator 전체 통과", s.validation_full_passed, pct(s.validation_full_pass_ratio))}
          ${metric("Validator 파셜 통과", s.validation_partial_passed, pct(s.validation_partial_pass_ratio))}
          ${metric("Full RAG", s.full_retrievals, pct(s.full_retrieval_ratio))}
          ${metric("Delta RAG", s.delta_retrievals, pct(s.delta_retrieval_ratio))}
          ${metric("LLM calls", s.llm_calls)}
        </div>
      `;
    }

    function timingRows(pass) {
      const rowsA = [
        ["Embedding", "embedding_ms"],
        ["Routing", "route_ms"],
        ["Cache lookup", "cache_lookup_ms"],
        ["Validation", "validation_ms"],
        ["RAG 전체", "rag_total_ms"],
        ["RAG retrieval(DB)", "rag_db_ms"],
        ["RAG scoring", "rag_scoring_ms"],
        ["RAG score sort", "rag_score_sort_ms"],
        ["RAG reranking", "rag_rerank_ms"],
        ["LLM", "llm_ms"],
        ["Total", "total_ms"]
      ];
      const rowsB = [
        ["Embedding", "embedding_ms"],
        ["Cache lookup", "cache_lookup_ms"],
        ["Validation", "validation_ms"],
        ["FULL RAG 전체", "full_retrieval_total_ms"],
        ["FULL retrieval(DB)", "full_retrieval_db_ms"],
        ["FULL scoring", "full_retrieval_scoring_ms"],
        ["FULL score sort", "full_retrieval_score_sort_ms"],
        ["FULL reranking", "full_retrieval_rerank_ms"],
        ["Delta RAG 전체", "delta_retrieval_total_ms"],
        ["Delta retrieval(DB)", "delta_retrieval_db_ms"],
        ["Delta scoring", "delta_retrieval_scoring_ms"],
        ["Delta score sort", "delta_retrieval_score_sort_ms"],
        ["Delta reranking", "delta_retrieval_rerank_ms"],
        ["Delta filter", "delta_retrieval_filter_ms"],
        ["LLM", "llm_ms"],
        ["Total", "total_ms"]
      ];
      const rowsNoCache = [
        ["Embedding", "embedding_ms"],
        ["FULL RAG 전체", "full_retrieval_total_ms"],
        ["FULL retrieval(DB)", "full_retrieval_db_ms"],
        ["FULL scoring", "full_retrieval_scoring_ms"],
        ["FULL score sort", "full_retrieval_score_sort_ms"],
        ["FULL reranking", "full_retrieval_rerank_ms"],
        ["LLM", "llm_ms"],
        ["Total", "total_ms"]
      ];
      const rows = pass.mode === "A" ? rowsA : pass.mode === "B" ? rowsB : rowsNoCache;
      return rows.map(([label, key]) => {
        const s = pass.summary.timing_stats_ms?.[key];
        return `
          <tr>
            <td>${label}</td>
            <td>${s ? fmt(s.avg) : "-"}</td>
            <td>${s ? fmt(s.min) : "-"}</td>
            <td>${s ? fmt(s.max) : "-"}</td>
            <td>${s ? s.count : "-"}</td>
          </tr>
        `;
      }).join("");
    }

    function timingTable(title, pass) {
      return `
        <div class="result-block">
          <div class="mode-title">
            <h3>${title} · ${passLabel(pass.pass)}</h3>
            <span class="pill">avg / min / max</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>구간</th><th>Avg ms</th><th>Min ms</th><th>Max ms</th><th>Count</th></tr></thead>
              <tbody>${timingRows(pass)}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function decisionTable(title, pass) {
      const rows = Object.entries(pass.summary.decision_reasons || {})
        .map(([reason, count]) => `<tr><td>${reason}</td><td>${count}</td></tr>`)
        .join("");
      return `
        <div class="result-block">
          <h3>${title} · Decision Reasons</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Reason</th><th>Count</th></tr></thead>
              <tbody>${rows || `<tr><td>-</td><td>0</td></tr>`}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSuiteResult(result) {
      $("resultRoot").className = "";
      if (result.test_case === "scalability") {
        renderScalability(result);
        return;
      }
      const parts = [
        `<h2>${result.test_case === "cache" ? "TC1. Cache 동작 확인" : "TC2. 권한/버전 혼합 수행시간"}</h2>`,
        `<div class="hint">source=${result.source_id}, queries=${result.query_count}, llm=${result.llm_provider}${result.llm_model ? `/${result.llm_model}` : ""}</div>`,
        summaryCards(result)
      ];
      if (result.a) {
        result.a.passes.forEach((p) => {
          parts.push(timingTable("A안", p));
          parts.push(decisionTable("A안", p));
        });
      }
      if (result.b) {
        result.b.passes.forEach((p) => {
          parts.push(timingTable("B안", p));
          parts.push(decisionTable("B안", p));
        });
      }
      $("resultRoot").innerHTML = parts.join("");
    }

    function renderScalability(result) {
      const rows = result.scales.map((row) => {
        const no = row.no_cache.summary;
        const a = row.a.summary;
        const b = row.b.summary;
        return `
          <tr>
            <td>${row.scale}x</td>
            <td>${row.num_examples}</td>
            <td>${statText(no, "full_retrieval_total_ms")}</td>
            <td>${statText(a, "rag_total_ms")}</td>
            <td>${pct(a.cache_hit_ratio)}</td>
            <td>${statText(b, "full_retrieval_total_ms")}</td>
            <td>${statText(b, "delta_retrieval_total_ms")}</td>
            <td>${pct(b.cache_hit_ratio)}</td>
          </tr>
        `;
      }).join("");

      const detail = result.scales.map((row) => `
        <div class="result-block">
          <h3>Scale ${row.scale}x · ${row.source_id}</h3>
          <div class="cards">
            ${modeCard("A안", row.a)}
            ${modeCard("B안", row.b)}
            <div class="card">
              <h3>No-cache · Scale 실행</h3>
              ${metric("Total", row.no_cache.summary.total)}
              ${metric("Full RAG", row.no_cache.summary.full_retrievals)}
              ${metric("LLM calls", row.no_cache.summary.llm_calls)}
            </div>
          </div>
          ${timingTable("No-cache", row.no_cache)}
          ${timingTable("A안", row.a)}
          ${timingTable("B안", row.b)}
        </div>
      `).join("");

      $("resultRoot").innerHTML = `
        <h2>TC3. 데이터셋 확장성</h2>
        <div class="hint">dataset=${result.dataset}, base=${result.base_num_examples}, max_scale=${result.max_scale}, queries=${result.query_count}</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Scale</th><th>EU 예제</th><th>No-cache FULL RAG avg/min/max</th>
                <th>A RAG avg/min/max</th><th>A hit</th>
                <th>B FULL RAG avg/min/max</th><th>B Delta RAG avg/min/max</th><th>B hit</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${detail}
      `;
    }

    function renderLog(data) {
      $("resultRoot").className = "";
      $("resultRoot").innerHTML = `<div class="log">${JSON.stringify(data, null, 2)}</div>`;
    }

    function showError(err) {
      $("statusTitle").textContent = "오류";
      $("statusText").textContent = err.message;
      $("resultRoot").className = "";
      $("resultRoot").innerHTML = `<div class="log">${String(err.stack || err.message || err)}</div>`;
    }

    ["sampleRate", "routeThreshold", "cacheThreshold", "testCase"].forEach((id) => {
      $(id).addEventListener("input", updateLabels);
      $(id).addEventListener("change", updateLabels);
    });
    ["datasetFamily", "datasetSplit", "testCase"].forEach((id) => {
      $(id).addEventListener("change", async () => {
        try {
          await loadDatasets();
        } catch (err) {
          showError(err);
        }
      });
    });
    $("queryCount").addEventListener("input", () => {
      $("queryCount").dataset.userEdited = "true";
    });
    $("prepareBtn").addEventListener("click", prepareLongBench);
    $("seedBtn").addEventListener("click", seedPool);
    $("runSuiteBtn").addEventListener("click", runSuite);
    $("refreshBtn").addEventListener("click", async () => {
      setBusy(true, "통계 새로고침", "질문풀 상태를 확인합니다.");
      try {
        const stats = await refreshStats();
        renderLog(stats);
        $("statusTitle").textContent = "통계 갱신 완료";
        $("statusText").textContent = `현재 질문풀 ${stats.total}개`;
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    });

    (async function init() {
      updateLabels();
      setBusy(true, "초기화 중", "LongBench dataset과 질문풀 상태를 불러옵니다.");
      try {
        await loadDatasets();
        const stats = await refreshStats();
        $("statusTitle").textContent = "준비됨";
        $("statusText").textContent = `현재 질문풀 ${stats.total}개`;
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    })();
  </script>
</body>
</html>
