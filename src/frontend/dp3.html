<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DP3 Cache PoC</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --ink: #172033;
      --muted: #657084;
      --line: #d8dee9;
      --accent: #176b87;
      --accent2: #2e7d64;
      --soft: #e9f2f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
    }
    header {
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 19px; }
    nav a { margin-left: 16px; color: var(--muted); text-decoration: none; }
    main {
      display: grid;
      grid-template-columns: minmax(340px, 410px) minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      min-height: calc(100vh - 56px);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .settings {
      padding: 16px;
      overflow: auto;
      max-height: calc(100vh - 92px);
    }
    .section {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .section:first-child { border-top: 0; padding-top: 0; }
    h2 { margin: 0 0 12px; font-size: 15px; }
    label {
      display: block;
      margin: 11px 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    input, select, button { font: inherit; }
    input[type="number"], select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .checkline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.secondary {
      background: var(--accent2);
      border-color: var(--accent2);
      color: #fff;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      background: var(--soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }
    .content {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      min-width: 0;
    }
    .status {
      min-height: 58px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .status strong { font-size: 15px; }
    .status span { color: var(--muted); }
    .results {
      padding: 16px;
      overflow: auto;
      max-height: calc(100vh - 162px);
    }
    .empty {
      padding: 56px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }
    .card h3 { margin: 0 0 12px; font-size: 14px; }
    .metric {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      border-top: 1px solid #edf0f4;
    }
    .metric:first-of-type { border-top: 0; }
    .metric span { color: var(--muted); }
    .metric b { font-variant-numeric: tabular-nums; }
    .tables {
      display: grid;
      grid-template-columns: minmax(300px, 0.8fr) minmax(460px, 1.2fr);
      gap: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #edf0f4;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      background: #fafbfc;
      font-size: 12px;
      position: sticky;
      top: 0;
    }
    .log {
      white-space: pre-wrap;
      background: #101828;
      color: #e5e7eb;
      padding: 12px;
      border-radius: 8px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      overflow: auto;
      max-height: 320px;
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .settings, .results { max-height: none; }
      .cards, .tables { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>DP3 Cache PoC</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/compare">Compare</a>
      <a href="/chat">Chat</a>
    </nav>
  </header>

  <main>
    <aside class="panel settings">
      <div class="section">
        <h2>공통 설정</h2>
        <label for="dataset">LongBench Dataset</label>
        <select id="dataset"></select>

        <div class="row">
          <div>
            <label for="numExamples">EU 생성 예제 수</label>
            <input id="numExamples" type="number" min="1" max="200" value="5">
          </div>
          <div>
            <label for="queryCount">테스트 질문 수</label>
            <input id="queryCount" type="number" min="1" max="500" value="30">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="scope">Scope</label>
            <select id="scope">
              <option value="A">A</option>
              <option value="B">B</option>
            </select>
          </div>
          <div>
            <label for="seed">샘플 Seed</label>
            <input id="seed" type="number" value="7">
          </div>
        </div>

        <label class="checkline"><input id="resetMetadata" type="checkbox" checked> versioned EU metadata 재생성</label>
      </div>

      <div class="section">
        <h2>LLM 설정</h2>
        <label for="llmOption">LLM</label>
        <select id="llmOption">
          <option value="mock">Mock</option>
          <option value="llama-3.1-8b-instant">Llama 8B - llama-3.1-8b-instant</option>
          <option value="llama-3.3-70b-versatile">Llama 70B - llama-3.3-70b-versatile</option>
          <option value="qwen/qwen3.6-27b">Qwen 27B - qwen/qwen3.6-27b</option>
        </select>
      </div>

      <div class="section">
        <h2>질문풀</h2>
        <label for="sampleRate">필터링 질문풀 비율 <span id="sampleRateText" class="pill">10%</span></label>
        <input id="sampleRate" type="range" min="1" max="30" value="10">

        <div class="row">
          <div>
            <label for="minPerDataset">Dataset별 최소</label>
            <input id="minPerDataset" type="number" min="1" max="50" value="5">
          </div>
          <div>
            <label for="poolSeed">질문풀 Seed</label>
            <input id="poolSeed" type="number" value="42">
          </div>
        </div>
      </div>

      <div class="section">
        <h2>A/B 설정</h2>
        <label for="routeThreshold">A안 Route Threshold <span id="routeText" class="pill">0.70</span></label>
        <input id="routeThreshold" type="range" min="0" max="100" value="70">

        <label for="cacheThreshold">공통 Cache Threshold <span id="cacheText" class="pill">0.86</span></label>
        <input id="cacheThreshold" type="range" min="0" max="100" value="86">

        <label class="checkline"><input id="useReranker" type="checkbox"> Cross-Encoder reranking 사용</label>
        <div class="row">
          <div>
            <label for="rerankCandidates">Rerank 후보 수</label>
            <input id="rerankCandidates" type="number" min="5" max="100" value="30">
          </div>
          <div>
            <label for="rerankModel">Reranker</label>
            <select id="rerankModel">
              <option value="cross-encoder/ms-marco-MiniLM-L-6-v2">ms-marco-MiniLM-L-6-v2</option>
            </select>
          </div>
        </div>

        <label class="checkline"><input id="resetAnswerCache" type="checkbox" checked> 실행 전 Answer Cache 초기화</label>
        <label class="checkline"><input id="resetContextCache" type="checkbox" checked> 실행 전 Context Cache 초기화</label>
      </div>

      <div class="actions">
        <button id="prepareBtn">Prepare</button>
        <button id="seedBtn">Seed Pool</button>
      </div>
      <div class="actions">
        <button id="runABtn" class="primary">Run A</button>
        <button id="runBBtn" class="secondary">Run B</button>
      </div>
      <div class="actions">
        <button id="runABBtn">Run A+B</button>
        <button id="refreshBtn">Refresh Stats</button>
      </div>
    </aside>

    <section class="content">
      <div class="panel status">
        <div>
          <strong id="statusTitle">준비됨</strong><br>
          <span id="statusText">설정을 조정한 뒤 실행하세요.</span>
        </div>
        <span id="poolInfo" class="pill">pool: -</span>
      </div>

      <div class="panel results">
        <div id="resultRoot" class="empty">아직 실행 결과가 없습니다.</div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const API_BASE = location.port === "8000" ? "" : "http://127.0.0.1:8000";
    const controls = [
      "prepareBtn", "seedBtn", "runABtn", "runBBtn", "runABBtn", "refreshBtn",
      "dataset", "numExamples", "queryCount", "scope", "seed",
      "llmOption",
      "sampleRate", "minPerDataset", "poolSeed",
      "routeThreshold", "cacheThreshold", "useReranker", "rerankCandidates", "rerankModel", "resetAnswerCache",
      "resetContextCache", "resetMetadata"
    ];

    function setBusy(isBusy, title, text) {
      controls.forEach((id) => { $(id).disabled = isBusy; });
      if (title) $("statusTitle").textContent = title;
      if (text) $("statusText").textContent = text;
    }

    function threshold(id) {
      return Number($(id).value) / 100;
    }

    function updateLabels() {
      $("sampleRateText").textContent = `${$("sampleRate").value}%`;
      $("routeText").textContent = threshold("routeThreshold").toFixed(2);
      $("cacheText").textContent = threshold("cacheThreshold").toFixed(2);
    }

    async function api(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`${response.status} ${text}`);
      }
      return response.json();
    }

    function sourceId() {
      return `dp3_longbench_${$("dataset").value}_${Number($("numExamples").value)}`;
    }

    function llmPayload() {
      const option = $("llmOption").value;
      if (option === "mock") {
        return { llm_provider: "mock", model: null };
      }
      return { llm_provider: "groq", model: option };
    }

    async function loadDatasets() {
      const data = await api("/api/dp3/longbench/datasets");
      $("dataset").innerHTML = data.datasets.map((d) =>
        `<option value="${d.dataset}">${d.dataset} (${d.rows})</option>`
      ).join("");
      if (data.datasets.some((d) => d.dataset === "multifieldqa_en")) {
        $("dataset").value = "multifieldqa_en";
      }
    }

    async function refreshStats() {
      const stats = await api("/api/dp3/question-pool/stats");
      $("poolInfo").textContent = `pool: ${stats.total}`;
      return stats;
    }

    async function prepareLongBench() {
      setBusy(true, "LongBench 준비 중", "ROI-RAG EU와 versioned metadata를 준비합니다.");
      try {
        const result = await api("/api/dp3/longbench/prepare", {
          method: "POST",
          body: JSON.stringify({
            dataset_name: $("dataset").value,
            num_examples: Number($("numExamples").value),
            auto_download: true,
            reset: false,
            reset_metadata: $("resetMetadata").checked
          })
        });
        $("statusTitle").textContent = "LongBench 준비 완료";
        $("statusText").textContent = `${result.source_id}, EU ${result.context_unit_count}, version rows ${result.version_rows}`;
        renderLog(result);
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    async function seedPool() {
      setBusy(true, "질문풀 생성 중", "LongBench 질문/task에서 필터링 pool을 seed합니다.");
      try {
        const result = await api("/api/dp3/question-pool/seed", {
          method: "POST",
          body: JSON.stringify({
            dataset: null,
            sample_rate: threshold("sampleRate"),
            min_per_dataset: Number($("minPerDataset").value),
            seed: Number($("poolSeed").value),
            reset: true,
            include_smoke: false
          })
        });
        await refreshStats();
        $("statusTitle").textContent = "질문풀 생성 완료";
        $("statusText").textContent = `${result.total_questions}개 중 ${result.seeded_questions}개 seed`;
        renderLog(result);
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    function commonPayload() {
      return {
        source_id: sourceId(),
        dataset: null,
        count: Number($("queryCount").value),
        seed: Number($("seed").value),
        user_scope: $("scope").value,
        cache_threshold: threshold("cacheThreshold"),
        ...llmPayload(),
        use_reranker: $("useReranker").checked,
        rerank_candidates: Number($("rerankCandidates").value),
        rerank_model: $("rerankModel").value,
        include_smoke: false
      };
    }

    async function runA() {
      setBusy(true, "A안 테스트 실행 중", "Answer Cache batch를 실행합니다.");
      try {
        const result = await api("/api/dp3/answer-cache/batch", {
          method: "POST",
          body: JSON.stringify({
            ...commonPayload(),
            route_threshold: threshold("routeThreshold"),
            reset_cache: $("resetAnswerCache").checked
          })
        });
        $("statusTitle").textContent = "A안 테스트 완료";
        $("statusText").textContent = `${result.sampled_query_count}개 질문`;
        renderModeResult("A안 Answer Cache", result, "A");
        return result;
      } catch (err) {
        showError(err);
        throw err;
      } finally {
        setBusy(false);
      }
    }

    async function runB() {
      setBusy(true, "B안 테스트 실행 중", "Context Cache batch를 실행합니다.");
      try {
        const result = await api("/api/dp3/context-cache/batch", {
          method: "POST",
          body: JSON.stringify({
            ...commonPayload(),
            reset_cache: $("resetContextCache").checked
          })
        });
        $("statusTitle").textContent = "B안 테스트 완료";
        $("statusText").textContent = `${result.sampled_query_count}개 질문`;
        renderModeResult("B안 Context Cache", result, "B");
        return result;
      } catch (err) {
        showError(err);
        throw err;
      } finally {
        setBusy(false);
      }
    }

    async function runAB() {
      setBusy(true, "A+B 테스트 실행 중", "A안을 실행한 뒤 B안을 실행합니다.");
      try {
        const a = await api("/api/dp3/answer-cache/batch", {
          method: "POST",
          body: JSON.stringify({
            ...commonPayload(),
            route_threshold: threshold("routeThreshold"),
            reset_cache: $("resetAnswerCache").checked
          })
        });
        const b = await api("/api/dp3/context-cache/batch", {
          method: "POST",
          body: JSON.stringify({
            ...commonPayload(),
            reset_cache: $("resetContextCache").checked
          })
        });
        $("statusTitle").textContent = "A+B 테스트 완료";
        $("statusText").textContent = `${a.sampled_query_count}개 질문으로 비교`;
        renderCompare(a, b);
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    }

    function pct(value, total) {
      if (!total) return "0.0%";
      return `${((value / total) * 100).toFixed(1)}%`;
    }

    function passLabel(pass) {
      return {
        v1_first: "V1 첫 실행",
        v1_repeat: "V1 반복",
        v2_validation: "V2 검증"
      }[pass] || pass;
    }

    function metric(label, value, extra = "") {
      return `<div class="metric"><span>${label}</span><b>${value}${extra ? ` <small>${extra}</small>` : ""}</b></div>`;
    }

    function summaryValue(summary, mode, key) {
      if (mode === "A" && key === "hit") return summary.cache_hits || 0;
      if (mode === "B" && key === "hit") return summary.context_cache_hits || 0;
      if (key === "fallback") return summary.fallbacks || summary.full_retrievals || 0;
      return summary[key] || 0;
    }

    function timing(summary, key) {
      const value = summary.timing_avg_ms?.[key];
      return Number.isFinite(value) ? `${value.toFixed(1)}ms` : "-";
    }

    function renderCards(result, mode) {
      return result.passes.map((p) => {
        const s = p.summary;
        const hitLabel = mode === "A" ? "Answer Hit" : "Context Hit";
        return `
          <div class="card">
            <h3>${passLabel(p.pass)}</h3>
            ${metric("Total", s.total)}
            ${mode === "A" ? metric("Route Passed", s.route_passed, pct(s.route_passed, s.total)) : ""}
            ${metric(hitLabel, summaryValue(s, mode, "hit"), pct(summaryValue(s, mode, "hit"), s.total))}
            ${metric("Validation Passed", s.validation_passed, pct(s.validation_passed, s.total))}
            ${mode === "B" ? metric("Delta Retrieval", s.delta_retrievals || 0) : ""}
            ${mode === "B" ? metric("Full Retrieval", s.full_retrievals || 0) : metric("Fallback", s.fallbacks || 0)}
            ${metric("LLM Calls", s.llm_calls)}
            ${metric("Avg Total", timing(s, "total_ms"))}
            ${mode === "A" ? metric("Avg RAG", timing(s, "rag_total_ms")) : metric("Avg Full RAG", timing(s, "full_retrieval_total_ms"))}
            ${mode === "A" ? metric("Avg Rerank", timing(s, "rag_rerank_ms")) : metric("Avg Full Rerank", timing(s, "full_retrieval_rerank_ms"))}
            ${mode === "B" ? metric("Avg Delta RAG", timing(s, "delta_retrieval_total_ms")) : ""}
            ${mode === "B" ? metric("Avg Delta Rerank", timing(s, "delta_retrieval_rerank_ms")) : ""}
            ${metric("Avg LLM", timing(s, "llm_ms"))}
          </div>
        `;
      }).join("");
    }

    function renderModeResult(title, result, mode) {
      const reasons = result.passes.flatMap((p) =>
        Object.entries(p.summary.decision_reasons).map(([reason, count]) => ({ pass: p.pass, reason, count }))
      );
      const datasets = result.passes[0]?.summary?.by_dataset || {};
      const datasetRows = Object.entries(datasets)
        .sort((a, b) => b[1].total - a[1].total)
        .slice(0, 18)
        .map(([name, s]) => `
          <tr>
            <td>${name}</td>
            <td>${s.total}</td>
            <td>${s.route_passed ?? "-"}</td>
            <td>${s.cache_hit ?? s.context_cache_hit ?? 0}</td>
            <td>${s.fallbacks ?? s.full_retrievals ?? 0}</td>
          </tr>
        `).join("");

      $("resultRoot").className = "";
      $("resultRoot").innerHTML = `
        <h2>${title}</h2>
        <div class="cards">${renderCards(result, mode)}</div>
        <div class="tables">
          <div class="card">
            <h3>Decision Reasons</h3>
            <table>
              <thead><tr><th>Pass</th><th>Reason</th><th>Count</th></tr></thead>
              <tbody>${reasons.map((r) => `<tr><td>${passLabel(r.pass)}</td><td>${r.reason}</td><td>${r.count}</td></tr>`).join("")}</tbody>
            </table>
          </div>
          <div class="card">
            <h3>Dataset Summary</h3>
            <table>
              <thead><tr><th>Dataset</th><th>Total</th><th>Route</th><th>Hit</th><th>Fallback</th></tr></thead>
              <tbody>${datasetRows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderCompare(a, b) {
      $("resultRoot").className = "";
      $("resultRoot").innerHTML = `
        <h2>A/B 비교</h2>
        <div class="card" style="margin-bottom:12px">
          <table>
            <thead>
              <tr><th>Pass</th><th>A Hit</th><th>A Fallback</th><th>A Total</th><th>A RAG</th><th>A LLM</th><th>B Hit</th><th>B Delta</th><th>B Full</th><th>B Total</th><th>B Full RAG</th><th>B LLM</th></tr>
            </thead>
            <tbody>
              ${a.passes.map((ap, i) => {
                const bp = b.passes[i];
                const as = ap.summary;
                const bs = bp.summary;
                return `<tr>
                  <td>${passLabel(ap.pass)}</td>
                  <td>${as.cache_hits || 0}</td>
                  <td>${as.fallbacks || 0}</td>
                  <td>${timing(as, "total_ms")}</td>
                  <td>${timing(as, "rag_total_ms")}</td>
                  <td>${as.llm_calls || 0}</td>
                  <td>${bs.context_cache_hits || 0}</td>
                  <td>${bs.delta_retrievals || 0}</td>
                  <td>${bs.full_retrievals || 0}</td>
                  <td>${timing(bs, "total_ms")}</td>
                  <td>${timing(bs, "full_retrieval_total_ms")}</td>
                  <td>${bs.llm_calls || 0}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
        <div class="cards">${renderCards(a, "A")}${renderCards(b, "B")}</div>
      `;
    }

    function renderLog(data) {
      $("resultRoot").className = "";
      $("resultRoot").innerHTML = `<div class="log">${JSON.stringify(data, null, 2)}</div>`;
    }

    function showError(err) {
      $("statusTitle").textContent = "오류";
      $("statusText").textContent = err.message;
      $("resultRoot").className = "";
      $("resultRoot").innerHTML = `<div class="log">${String(err.stack || err.message || err)}</div>`;
    }

    ["sampleRate", "routeThreshold", "cacheThreshold"].forEach((id) => {
      $(id).addEventListener("input", updateLabels);
    });
    $("prepareBtn").addEventListener("click", prepareLongBench);
    $("seedBtn").addEventListener("click", seedPool);
    $("runABtn").addEventListener("click", runA);
    $("runBBtn").addEventListener("click", runB);
    $("runABBtn").addEventListener("click", runAB);
    $("refreshBtn").addEventListener("click", async () => {
      setBusy(true, "통계 새로고침", "질문풀 상태를 확인합니다.");
      try {
        const stats = await refreshStats();
        renderLog(stats);
        $("statusTitle").textContent = "통계 갱신 완료";
        $("statusText").textContent = `현재 질문풀 ${stats.total}개`;
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    });

    (async function init() {
      updateLabels();
      setBusy(true, "초기화 중", "LongBench dataset과 질문풀 상태를 불러옵니다.");
      try {
        await loadDatasets();
        const stats = await refreshStats();
        $("statusTitle").textContent = "준비됨";
        $("statusText").textContent = `현재 질문풀 ${stats.total}개`;
      } catch (err) {
        showError(err);
      } finally {
        setBusy(false);
      }
    })();
  </script>
</body>
</html>
